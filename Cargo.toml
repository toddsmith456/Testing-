[package]
name = "nostur-rust"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
nostr-sdk = "=0.45.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
url = "2"
thiserror = "2"

[target.'cfg(not(target_os = "android"))'.dependencies]
eframe = { version = "=0.36.2", default-features = false, features = ["default_fonts", "glow", "x11"] }

[target.'cfg(target_os = "android")'.dependencies]
eframe = { version = "=0.36.2", default-features = false, features = ["android-native-activity", "default_fonts", "glow"] }
android-activity = { version = "0.6", features = ["native-activity"] }

[dev-dependencies]
nostr-sdk = { version = "=0.45.6", features = ["local-relay"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }

[profile.dev]
debug = 0
