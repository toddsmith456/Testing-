name: Publish development prerelease
on:
  push:
    tags: ['v*-dev.*']
permissions:
  contents: write
jobs:
  tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install desktop build dependencies
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxkbcommon-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libgl1-mesa-dev pkg-config
      - run: cargo test --locked
  publish:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - name: Install Android tools
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"'
      - name: Build and verify debug-signed development APK
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
          ./scripts/build-android.sh
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 4 target/android-apk-arm64-v8a-debug/nostur-rust-debug.apk
          cp target/android-apk-arm64-v8a-debug/nostur-rust-debug.apk nostur-rust-arm64-development-debug.apk
          sha256sum nostur-rust-arm64-development-debug.apk > SHA256SUMS.txt
      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cat > release-notes.txt <<'NOTES'
          **Experimental development prerelease — not a complete Nostur clone or production release.**

          ARM64 Android development APK, signed with an automatically generated debug key. The key is ephemeral: future APKs will generally not update this installation in place. Installing a differently signed build may require uninstalling this one and losing its local data. Do not use with sensitive accounts or as the sole copy of data.

          Features include offline public-account switching, local-only mutes, local public-event cache and bookmarks, and experimental public notes and NIP-10 replies through a NIP-46 remote signer. Signing and publication are separate actions. Relay operators can see IP addresses and request metadata; mutes are not published or synced. No automatic remote media, analytics or advertising is intentionally included.

          Host tests and build/signature checks are automated, but this build has not been tested on an Android device, with real signers, or with public relays, and has not received an independent security, privacy or dependency audit. DMs, notifications, payments, media and substantial Nostur functionality are missing. See README.md and docs/PARITY.md for limitations.
          NOTES
          gh release create "$TAG" --verify-tag --prerelease --title "${TAG} — experimental Android development build" --notes-file release-notes.txt nostur-rust-arm64-development-debug.apk SHA256SUMS.txt
