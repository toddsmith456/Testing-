name: Rust checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux UI build dependencies
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxkbcommon-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libgl1-mesa-dev pkg-config
      - run: cargo test --locked
  android-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - name: Install Android tools
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"'
      - name: Build and verify development APK
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
          ./scripts/build-android.sh
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 4 target/android-apk-arm64-v8a-debug/nostur-rust-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: arm64-development-apk-not-a-release
          path: target/android-apk-arm64-v8a-debug/nostur-rust-debug.apk
